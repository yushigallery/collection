<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUSHI'S WORLD</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #fff;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      background: #fff;
      padding: 1em 0;
      border-bottom: 1px solid #eee;
    }
    header img {
      max-width: 100%;
      height: auto;
    }
    .search-container {
      text-align: center;
      padding: 1em;
    }
    input[type="text"] {
      width: 80%;
      max-width: 400px;
      padding: 0.5em;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .icon-links {
      display: flex;
      justify-content: center;
      gap: 1.5em;
      margin-top: 1em;
      flex-wrap: wrap;
    }
    .icon-links a {
      text-align: center;
      text-decoration: none;
      color: #333;
    }
    .icon-links img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #eee;
    }
    details {
      padding: 1em;
      border-top: 1px solid #eee;
    }
    .about-u {
      padding: 1em;
    }
    .link-list {
      padding: 1em;
    }
    .link-list ul {
      list-style: none;
      padding-left: 0;
    }
    .link-list li {
      margin: 0.5em 0;
    }
    .link-list a {
      text-decoration: none;
      color: #0070f3;
    }
  </style>
</head>
<body>
  <header>
    <h1>YUSHI'S WORLD</h1>
    <img src="banner.jpg" alt="YUSHI Banner">
  </header>
  <div class="search-container">
    <input type="text" placeholder="请输入关键词..." oninput="searchLinks(this.value)">
  </div>
  <div class="icon-links">
    <a href="https://weibo.com/u/7895044498" target="_blank">
      <img src="weibo.jpg" alt="微博"><br>微博
    </a>
    <a href="https://v.douyin.com/h7fixa56lIk/" target="_blank">
      <img src="douyin.jpg" alt="抖音"><br>抖音
    </a>
    <a href="https://space.bilibili.com/3546586890111682" target="_blank">
      <img src="bili.jpg" alt="B站"><br>B站
    </a>
    <a href="https://www.xiaohongshu.com/user/profile/63b4696e0000000027037de5?..." target="_blank">
      <img src="xiaohongshu.jpg" alt="小红书"><br>小红书
    </a>
  </div>
  <details>
    <summary>YUSHI 简介（点击展开）</summary>
    <div class="about-u">
      <p>姓名：YUSHI（得能勇志；유우시；ユウシ）<br>
      生日：2004.04.05<br>...（中略）...<br>
      性格关键词：安静、冷静、非常害羞但热心善良耐心</p>
    </div>
  </details>
  <div class="link-list">
    <h2>📁 分类浏览（可折叠）</h2>
    <div id="groupedView"></div>
    <h2>🔍 搜索结果</h2>
    <ul id="searchResults"></ul>
  </div>

<script>
  const groupedData = {
    "demo": [
      { title: "测试条目", url: "https://example.com" }
    ]
  };
</script>
  <script>
    window.addEventListener('load', () => {
      if (typeof groupedData !== 'undefined') {
        renderGrouped(groupedData);
      }
    });

    function renderGrouped(data) {
      const container = document.getElementById('groupedView');
      container.innerHTML = '';
      for (const folder in data) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = folder;
        details.appendChild(summary);
        const ul = document.createElement('ul');
        data[folder].forEach(entry => {
          const li = document.createElement('li');
          li.innerHTML = `<a href="${entry.url}" target="_blank">${entry.title}</a>`;
          ul.appendChild(li);
        });
        details.appendChild(ul);
        container.appendChild(details);
      }
    }

    function searchLinks(keyword) {
      keyword = keyword.toLowerCase();
      const results = [];
      if (typeof groupedData !== 'undefined') {
        for (const folder in groupedData) {
          groupedData[folder].forEach(entry => {
            if (entry.title.toLowerCase().includes(keyword)) {
              results.push(entry);
            }
          });
        }
      }
      renderSearchResults(results);
    }

    function renderSearchResults(list) {
      const container = document.getElementById('searchResults');
      container.innerHTML = '';
      list.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a>`;
        container.appendChild(li);
      });
    }
  </script>
</body>
</html>
